<!DOCTYPE html>
<html lang="es-VE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario — Alfa interno</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/img/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="adm-page" class="hidden">
  <div class="kpis" id="resumen" style="margin-bottom:20px"></div>

  <div class="adm-tools">
    <div class="adm-search">
      <span id="icBuscar"></span>
      <input id="buscar" type="search" placeholder="Buscar modelo, línea o procesador…">
    </div>
    <div class="seg" id="filtroCat"></div>
    <select class="sort-select" id="orden">
      <option value="nombre">Nombre A–Z</option>
      <option value="stock-asc">Menos stock primero</option>
      <option value="stock-desc">Más stock primero</option>
      <option value="precio-desc">Precio: mayor a menor</option>
      <option value="precio-asc">Precio: menor a mayor</option>
      <option value="vendidos">Más vendidos</option>
    </select>
  </div>

  <div class="box">
    <div class="box-head">
      <div><h2>Catálogo</h2><p id="contador"></p></div>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" type="button" id="btnCSV"></button>
        <button class="btn btn-ghost btn-sm" type="button" id="btnRestaurar"></button>
        <button class="btn btn-primary btn-sm" type="button" id="btnNuevo"></button>
      </div>
    </div>
    <div class="box-body tight"><div class="tabla-wrap" id="tabla"></div></div>
  </div>

  <div class="box">
    <div class="box-head"><div><h2>Movimientos recientes de inventario</h2><p>Altas, bajas y ajustes registrados por el equipo</p></div></div>
    <div class="box-body" id="movimientos"></div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/app.js"></script>
<script src="admin.js"></script>
<script>
(async function () {
  const A = window.ALFA;
  if (!(await ADM.iniciar("inventario", "Inventario", "Carga, edita, ajusta stock y da de baja modelos"))) return;

  const $ = (id) => document.getElementById(id);
  $("icBuscar").innerHTML = A.icon("search");
  $("btnCSV").innerHTML = A.icon("download") + " Exportar CSV";
  $("btnRestaurar").innerHTML = A.icon("refresh") + " Restaurar catálogo";
  $("btnNuevo").innerHTML = A.icon("plusCircle") + " Cargar modelo";

  const F = { texto: "", cat: "todas", orden: "nombre" };
  const IMAGENES_DISPONIBLES = [...new Set(A.productosSemilla.flatMap((p) => p.imagenes))];

  const CATS = () => {
    const set = {};
    A.products.forEach((p) => (set[p.categoria] = p.categoriaLabel));
    return [{ id: "todas", label: "Todas" }].concat(Object.entries(set).map(([id, label]) => ({ id, label })));
  };

  /* ==================== Resumen ==================== */
  function pintarResumen() {
    const unidades = A.products.reduce((s, p) => s + p.stock, 0);
    const valor = A.round2(A.products.reduce((s, p) => s + p.stock * p.precio, 0));
    const bajos = A.products.filter((p) => p.stock <= 3 && p.stock > 0);
    const agotados = A.products.filter((p) => p.stock === 0);

    const items = [
      ["box", "", "Modelos en catálogo", A.products.length, `${CATS().length - 1} categorías`, ""],
      ["package", "", "Unidades en almacén", unidades, "Sumando todos los modelos", ""],
      ["dollar", "green", "Valor del inventario", A.fmtUSD(valor), A.fmtBsRaw(valor * A.config.bcvRate), ""],
      ["alert", agotados.length ? "red" : bajos.length ? "amber" : "green", "Necesitan reposición", bajos.length + agotados.length,
        agotados.length ? `${agotados.length} agotado(s), ${bajos.length} con stock bajo` : bajos.length ? "Quedan 3 unidades o menos" : "Todo con inventario sano",
        agotados.length ? "critico" : bajos.length ? "alerta" : ""],
    ];
    $("resumen").innerHTML = items
      .map(([ic, col, dt, dd, sub, cls]) => `<div class="kpi ${cls}">
        <div class="kpi-ic ${col}">${A.icon(ic)}</div><dt>${dt}</dt><dd>${dd}</dd><span class="sub">${sub}</span></div>`)
      .join("");
  }

  function pintarFiltros() {
    $("filtroCat").innerHTML = CATS()
      .map((c) => `<button type="button" data-c="${c.id}" class="${c.id === F.cat ? "is-active" : ""}">${c.label}
        <span class="n">${c.id === "todas" ? A.products.length : A.products.filter((p) => p.categoria === c.id).length}</span></button>`)
      .join("");
  }

  $("filtroCat").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-c]");
    if (!b) return;
    F.cat = b.dataset.c; pintarFiltros(); pintar();
  });
  $("buscar").addEventListener("input", (e) => { F.texto = e.target.value.toLowerCase(); pintar(); });
  $("orden").addEventListener("change", (e) => { F.orden = e.target.value; pintar(); });

  const vendidos = () => {
    const m = {};
    ADM.ventasPorModelo().forEach((v) => (m[v.id] = v.unidades));
    return m;
  };

  function filtrados() {
    let lista = A.products.slice();
    if (F.cat !== "todas") lista = lista.filter((p) => p.categoria === F.cat);
    if (F.texto) {
      lista = lista.filter((p) =>
        (p.nombre + " " + p.linea + " " + p.categoriaLabel + " " + Object.values(p.specs).join(" ")).toLowerCase().includes(F.texto)
      );
    }
    const v = vendidos();
    const ord = {
      nombre: (a, b) => a.nombre.localeCompare(b.nombre, "es"),
      "stock-asc": (a, b) => a.stock - b.stock,
      "stock-desc": (a, b) => b.stock - a.stock,
      "precio-asc": (a, b) => a.precio - b.precio,
      "precio-desc": (a, b) => b.precio - a.precio,
      vendidos: (a, b) => (v[b.id] || 0) - (v[a.id] || 0),
    }[F.orden];
    return lista.sort(ord);
  }

  /* ==================== Tabla ==================== */
  function pintar() {
    const lista = filtrados();
    const v = vendidos();
    $("contador").textContent = `${lista.length} ${lista.length === 1 ? "modelo" : "modelos"} en pantalla`;

    $("tabla").innerHTML = lista.length
      ? `<table class="tabla">
        <thead><tr>
          <th>Modelo</th><th>Categoría</th><th class="num">Precio</th><th class="num">Vendidas</th>
          <th style="text-align:center">Stock</th><th>Estado</th><th class="acciones">Acciones</th>
        </tr></thead>
        <tbody>${lista.map((p) => `
          <tr>
            <td>
              <div class="row" style="gap:10px">
                <span class="mini-img"><img src="${A.img(p.imagenes[0])}" alt=""></span>
                <span>
                  <span class="principal">${A.escape(p.nombre)}</span>
                  <div class="sec">${A.escape(p.linea)} · ${A.escape(p.color)}</div>
                </span>
              </div>
            </td>
            <td class="small">${A.escape(p.categoriaLabel)}</td>
            <td class="num">
              <strong>${A.fmtUSD(p.precio)}</strong>
              ${p.precioAnterior ? `<div class="sec" style="text-decoration:line-through">${A.fmtUSD(p.precioAnterior)}</div>` : ""}
            </td>
            <td class="num">${v[p.id] || 0}</td>
            <td style="text-align:center">
              <div class="row" style="gap:5px;justify-content:center">
                <button class="tbtn" type="button" onclick="ajustar('${p.id}', -1)" title="Restar 1">${A.icon("minus")}</button>
                <input class="stock-input" type="number" min="0" value="${p.stock}" data-stock="${p.id}" aria-label="Stock de ${A.escape(p.nombre)}">
                <button class="tbtn" type="button" onclick="ajustar('${p.id}', 1)" title="Sumar 1">${A.icon("plus")}</button>
              </div>
            </td>
            <td>${ADM.stockBadge(p)}</td>
            <td class="acciones">
              <a class="tbtn" href="../producto.html?id=${p.id}" target="_blank" rel="noopener" title="Ver en la tienda">${A.icon("eye")}</a>
              <button class="tbtn" type="button" onclick="editar('${p.id}')" title="Editar">${A.icon("edit")}</button>
              <button class="tbtn" type="button" onclick="duplicar('${p.id}')" title="Duplicar">${A.icon("copyDoc")}</button>
              <button class="tbtn danger" type="button" onclick="eliminar('${p.id}')" title="Dar de baja">${A.icon("trash")}</button>
            </td>
          </tr>`).join("")}
        </tbody></table>`
      : ADM.vacio("search", "Sin resultados", "Ningún modelo coincide con el filtro.");

    document.querySelectorAll("[data-stock]").forEach((inp) => {
      inp.addEventListener("change", () => {
        const p = A.getProduct(inp.dataset.stock);
        const n = Math.max(0, parseInt(inp.value, 10) || 0);
        if (n === p.stock) return;
        const antes = p.stock;
        p.stock = n;
        A.guardarCatalogo();
        A.bitacora.add("stock-ajustado", `${p.nombre}: ${antes} → ${n} unidades`, p.id);
        recargar(`Stock de ${p.nombre} actualizado a ${n}`);
      });
    });
  }

  window.ajustar = function (id, delta) {
    const p = A.getProduct(id);
    const antes = p.stock;
    p.stock = Math.max(0, p.stock + delta);
    if (p.stock === antes) return;
    A.guardarCatalogo();
    A.bitacora.add("stock-ajustado", `${p.nombre}: ${antes} → ${p.stock} unidades`, p.id);
    recargar();
  };

  /* ==================== Formulario de modelo ==================== */
  const CAMPOS_SPEC = ["Procesador", "Gráficos", "Memoria", "Almacenamiento", "Pantalla", "Sistema operativo", "Batería", "Peso", "Puertos", "Conectividad", "Cámara", "Garantía"];

  function formulario(p, esNuevo) {
    const v = (x) => A.escape(x == null ? "" : x);
    return `
    <div class="grid-2" style="gap:16px">
      <div class="field col-span-2">
        <label for="fNombre">Nombre del modelo <span class="req">*</span></label>
        <input class="input" id="fNombre" value="${v(p.nombre)}" placeholder="Alfa Zenith 14">
      </div>
      <div class="field">
        <label for="fLinea">Línea</label>
        <input class="input" id="fLinea" value="${v(p.linea)}" placeholder="Zenith">
      </div>
      <div class="field">
        <label for="fCategoria">Categoría</label>
        <select class="select" id="fCategoria">
          ${[["ultrabook", "Ultrabook"], ["gaming", "Gaming"], ["convertible", "Convertible 2 en 1"], ["creador", "Creadores"], ["empresa", "Empresarial"], ["hogar", "Uso diario"]]
            .map(([id, lb]) => `<option value="${id}"${p.categoria === id ? " selected" : ""}>${lb}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label for="fPrecio">Precio de venta (USD) <span class="req">*</span></label>
        <input class="input" id="fPrecio" type="number" min="1" step="1" value="${p.precio || ""}">
      </div>
      <div class="field">
        <label for="fPrecioAnt">Precio tachado (opcional)</label>
        <input class="input" id="fPrecioAnt" type="number" min="0" step="1" value="${p.precioAnterior || ""}">
      </div>
      <div class="field">
        <label for="fStock">Unidades en almacén</label>
        <input class="input" id="fStock" type="number" min="0" step="1" value="${p.stock == null ? 0 : p.stock}">
      </div>
      <div class="field">
        <label for="fColor">Color de esta unidad</label>
        <input class="input" id="fColor" value="${v(p.color)}" placeholder="Plata Lunar">
      </div>
      <div class="field">
        <label for="fEtiquetas">Etiquetas (separadas por coma)</label>
        <input class="input" id="fEtiquetas" value="${v((p.etiquetas || []).join(", "))}" placeholder="Nuevo, Oferta">
      </div>
      <div class="field">
        <label for="fImagen">Imagen principal</label>
        <select class="select" id="fImagen">
          ${IMAGENES_DISPONIBLES.map((im) => `<option value="${im}"${(p.imagenes || [])[0] === im ? " selected" : ""}>${im}</option>`).join("")}
        </select>
      </div>
      <div class="field col-span-2">
        <label for="fResumen">Resumen corto (aparece en el catálogo) <span class="req">*</span></label>
        <textarea class="textarea" id="fResumen" rows="2" placeholder="Ultrabook de 14″ con chasis de aluminio…">${v(p.resumen)}</textarea>
      </div>
      <div class="field col-span-2">
        <label for="fDescripcion">Descripción larga</label>
        <textarea class="textarea" id="fDescripcion" rows="4">${v(p.descripcion)}</textarea>
      </div>
      <div class="field col-span-2">
        <label for="fDestacados">Puntos destacados (uno por línea)</label>
        <textarea class="textarea" id="fDestacados" rows="4">${v((p.destacados || []).join("\n"))}</textarea>
      </div>
    </div>

    <h4 style="font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-muted);margin:24px 0 12px">Ficha técnica</h4>
    <div class="grid-2" style="gap:14px">
      ${CAMPOS_SPEC.map((c, i) => `
        <div class="field">
          <label for="fSpec${i}">${c}</label>
          <input class="input" id="fSpec${i}" data-spec="${c}" value="${v((p.specs || {})[c])}">
        </div>`).join("")}
    </div>`;
  }

  function leerFormulario(bg, base) {
    const g = (id) => bg.querySelector("#" + id).value.trim();
    const specs = {};
    bg.querySelectorAll("[data-spec]").forEach((i) => { if (i.value.trim()) specs[i.dataset.spec] = i.value.trim(); });

    const nombre = g("fNombre");
    const precio = parseFloat(g("fPrecio"));
    const resumen = g("fResumen");
    if (!nombre || nombre.length < 4) { A.toast("El nombre es obligatorio", "alert"); return null; }
    if (!precio || precio <= 0) { A.toast("Indica un precio de venta válido", "alert"); return null; }
    if (!resumen) { A.toast("Escribe el resumen corto", "alert"); return null; }

    const catSel = bg.querySelector("#fCategoria");
    const img = g("fImagen");
    const familia = img.replace(/-\d+\.svg$/, "");
    const imagenes = IMAGENES_DISPONIBLES.filter((x) => x.startsWith(familia + "-"));

    return {
      ...base,
      nombre,
      linea: g("fLinea") || nombre.split(" ")[1] || "Alfa",
      categoria: catSel.value,
      categoriaLabel: catSel.options[catSel.selectedIndex].text,
      precio: A.round2(precio),
      precioAnterior: parseFloat(g("fPrecioAnt")) > precio ? A.round2(parseFloat(g("fPrecioAnt"))) : null,
      stock: Math.max(0, parseInt(g("fStock"), 10) || 0),
      color: g("fColor") || "Estándar",
      coloresDisponibles: base.coloresDisponibles && base.coloresDisponibles.length ? base.coloresDisponibles : [g("fColor") || "Estándar"],
      etiquetas: g("fEtiquetas").split(",").map((x) => x.trim()).filter(Boolean),
      resumen,
      descripcion: g("fDescripcion") || resumen,
      destacados: g("fDestacados").split("\n").map((x) => x.trim()).filter(Boolean),
      specs,
      imagenes: imagenes.length ? imagenes : [img],
    };
  }

  window.editar = function (id) {
    const p = A.getProduct(id);
    ADM.modal({
      titulo: "Editar " + p.nombre,
      subtitulo: "Los cambios se ven en la tienda de inmediato",
      ancho: "ancho",
      cuerpo: formulario(p, false),
      pie: `<button class="btn btn-ghost" type="button" onclick="ADM.cerrarModal()">Cancelar</button>
            <button class="btn btn-primary" type="button" id="okGuardar">${A.icon("save")} Guardar cambios</button>`,
      alAbrir: (bg) => {
        bg.querySelector("#okGuardar").onclick = () => {
          const nuevo = leerFormulario(bg, p);
          if (!nuevo) return;
          const i = A.products.findIndex((x) => x.id === id);
          A.products[i] = nuevo;
          A.guardarCatalogo();
          A.bitacora.add("modelo-editado", `Se editó ${nuevo.nombre} (${A.fmtUSD(nuevo.precio)}, ${nuevo.stock} unid.)`, id);
          ADM.cerrarModal();
          recargar("Modelo actualizado");
        };
      },
    });
  };

  $("btnNuevo").onclick = function () {
    const base = {
      id: "", rating: 4.5, reviews: 0, opiniones: [],
      etiquetas: ["Nuevo"], coloresDisponibles: [], specs: {},
    };
    ADM.modal({
      titulo: "Cargar un modelo nuevo",
      subtitulo: "Aparecerá en el catálogo público apenas lo guardes",
      ancho: "ancho",
      cuerpo: formulario(base, true),
      pie: `<button class="btn btn-ghost" type="button" onclick="ADM.cerrarModal()">Cancelar</button>
            <button class="btn btn-primary" type="button" id="okCrear">${A.icon("plusCircle")} Cargar modelo</button>`,
      alAbrir: (bg) => {
        bg.querySelector("#okCrear").onclick = () => {
          const nuevo = leerFormulario(bg, base);
          if (!nuevo) return;
          let id = nuevo.nombre.toLowerCase().replace(/^alfa\s+/, "").replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
          let n = 1;
          while (A.getProduct(id)) id = id.replace(/-\d+$/, "") + "-" + ++n;
          nuevo.id = id;
          A.products.unshift(nuevo);
          A.guardarCatalogo();
          A.bitacora.add("modelo-creado", `Se cargó ${nuevo.nombre} con ${nuevo.stock} unidades`, id);
          ADM.cerrarModal();
          recargar("Modelo cargado en el catálogo");
        };
      },
    });
  };

  window.duplicar = function (id) {
    const p = A.getProduct(id);
    ADM.confirmar("Duplicar modelo", `Se creará una copia de <strong>${A.escape(p.nombre)}</strong> con 0 unidades para que la edites.`, () => {
      const copia = JSON.parse(JSON.stringify(p));
      copia.id = p.id + "-copia";
      let n = 1;
      while (A.getProduct(copia.id)) copia.id = p.id + "-copia-" + ++n;
      copia.nombre = p.nombre + " (copia)";
      copia.stock = 0;
      copia.reviews = 0;
      copia.opiniones = [];
      A.products.unshift(copia);
      A.guardarCatalogo();
      A.bitacora.add("modelo-duplicado", `Copia creada de ${p.nombre}`, copia.id);
      recargar("Copia creada. Edítala antes de publicarla.");
      editar(copia.id);
    }, "Duplicar");
  };

  window.eliminar = function (id) {
    const p = A.getProduct(id);
    const enPedidos = A.orders.all().filter((o) => o.items.some((i) => i.id === id)).length;
    ADM.confirmar(
      "Dar de baja " + p.nombre,
      `Se quitará del catálogo público y del inventario (${p.stock} unidades).` +
        (enPedidos ? ` Hay <strong>${enPedidos} pedido(s)</strong> que lo incluyen: esos pedidos conservan su información.` : ""),
      () => {
        A.products = A.products.filter((x) => x.id !== id);
        A.guardarCatalogo();
        A.bitacora.add("modelo-eliminado", `Se dio de baja ${p.nombre}`, id);
        recargar("Modelo dado de baja");
      },
      "Dar de baja",
      true
    );
  };

  $("btnRestaurar").onclick = () =>
    ADM.confirmar(
      "Restaurar el catálogo original",
      "Vuelve a los 10 modelos de fábrica con sus precios y stock iniciales. Se pierden los modelos que hayas cargado y los ajustes de stock.",
      () => { A.restaurarCatalogo(); A.bitacora.add("catalogo-restaurado", "Catálogo devuelto a los valores originales"); recargar("Catálogo restaurado"); },
      "Restaurar",
      true
    );

  /* ==================== Movimientos ==================== */
  function pintarMovimientos() {
    const movs = A.bitacora.all()
      .filter((b) => ["stock-ajustado", "modelo-creado", "modelo-editado", "modelo-eliminado", "modelo-duplicado", "catalogo-restaurado", "pedido-creado", "pedido-cancelado"].includes(b.accion))
      .slice(0, 12);

    $("movimientos").innerHTML = movs.length
      ? movs.map((m) => `<div class="alerta-fila">
          <span class="kpi-ic ${m.accion === "modelo-eliminado" ? "red" : m.accion === "modelo-creado" ? "green" : ""}" style="margin:0;width:32px;height:32px">
            ${A.icon({ "stock-ajustado": "box", "modelo-creado": "plusCircle", "modelo-editado": "edit", "modelo-eliminado": "trash", "modelo-duplicado": "copyDoc", "catalogo-restaurado": "refresh", "pedido-creado": "receipt", "pedido-cancelado": "xCircle" }[m.accion] || "box", "icon-16")}
          </span>
          <div class="grow">
            <strong style="font-size:.86rem;color:var(--brand-deep);display:block">${A.escape(m.detalle)}</strong>
            <span class="tiny muted">${A.escape(m.usuario)} · ${ADM.hace(m.fecha)}</span>
          </div>
        </div>`).join("")
      : `<p class="small muted">Todavía no hay movimientos registrados.</p>`;
  }

  /* ==================== Exportar ==================== */
  $("btnCSV").onclick = () => {
    const v = vendidos();
    ADM.exportarCSV(
      "inventario-alfa",
      ["Codigo", "Modelo", "Linea", "Categoria", "Precio USD", "Precio Bs", "Stock", "Vendidas", "Valor inventario USD", "Procesador", "Memoria", "Almacenamiento", "Pantalla"],
      filtrados().map((p) => [
        p.id, p.nombre, p.linea, p.categoriaLabel,
        p.precio.toFixed(2), (p.precio * A.config.bcvRate).toFixed(2),
        p.stock, v[p.id] || 0, (p.stock * p.precio).toFixed(2),
        p.specs.Procesador || "", p.specs.Memoria || "", p.specs.Almacenamiento || "", p.specs.Pantalla || "",
      ])
    );
  };

  function recargar(mensaje) {
    pintarResumen(); pintarFiltros(); pintar(); pintarMovimientos();
    if (mensaje) A.toast(mensaje, "checkCircle");
  }

  recargar();
})();
</script>
</body>
</html>
